name: Frogbot Scan Pull Request

# Frogbot must live in its own workflow (not the reusable app-build workflow):
# it verifies that the triggering workflow file declares 'environment: frogbot'
# by reading the file at GITHUB_WORKFLOW_REF. For a reusable workflow that ref
# points at the app caller, and a caller job cannot set 'environment', so the
# check only passes from a dedicated workflow like this one.
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read
  security-events: write
  id-token: write

env:
  REGISTRY: artifacts-artefacts.devops.cloud-nuage.canada.ca

jobs:
  scan-pull-request:
    runs-on: ubuntu-latest
    # SECURITY: pull_request_target runs with access to secrets/OIDC while
    # checking out untrusted PR code. The 'frogbot' environment gates this --
    # add required reviewers under Settings > Environments > frogbot so a
    # maintainer must approve each run before secrets are exposed.
    environment: frogbot
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup JFrog CLI with OIDC
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-jfrog-cli
        env:
          JF_URL: https://${{ env.REGISTRY }}
          JF_PROJECT: ssc-aurora
          JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"
        with:
          oidc-provider-name: github-oidc
          version: 2.91.0

      - name: Run Frogbot
        # Pinned to v2: v3 requires the platform-side XSC "config profile"
        # endpoint, which returns 403 on this instance. v2 uses env vars +
        # the local .frogbot-config.yml instead.
        uses: jfrog/frogbot@v2.35.2
        env:
          JF_URL: https://${{ env.REGISTRY }}
          JF_PROJECT: ssc-aurora
          JF_ACCESS_TOKEN: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_INCLUDE_ALL_VULNERABILITIES: "true"
          JF_ENABLE_SAST: "false"
          JF_ENABLE_SECRETS: "false"
          JF_ENABLE_IAC: "false"
          JF_FAIL: "false"
