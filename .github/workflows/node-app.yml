name: Simple Node.js Build and Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/node-app/**"
      - ".github/workflows/node-app.yml"
      - ".github/workflows/reusable-app-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/node-app/**"
      - ".github/workflows/node-app.yml"
      - ".github/workflows/reusable-app-build.yml"

jobs:
  build:
    uses: ./.github/workflows/reusable-app-build.yml
    permissions:
      id-token: write
      contents: read
      security-events: write
      pull-requests: write
    with:
      app: node-app
      language: Node.js
    secrets: inherit
