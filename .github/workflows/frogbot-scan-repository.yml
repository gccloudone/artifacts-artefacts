name: Frogbot Scan Repository

# Scans the main branch and opens fix pull requests for known vulnerabilities.
# Repository scans do not require the 'frogbot' environment (that check only
# applies to scan-pull-request).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  security-events: write
  id-token: write

env:
  REGISTRY: artifacts-artefacts.devops.cloud-nuage.canada.ca

jobs:
  scan-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JFrog CLI with OIDC
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-jfrog-cli
        env:
          JF_URL: https://${{ env.REGISTRY }}
          JF_PROJECT: ssc-aurora
          JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"
        with:
          oidc-provider-name: github-oidc
          version: 2.91.0

      - name: Run Frogbot
        # Pinned to v2: v3 requires the platform-side XSC "config profile"
        # endpoint, which returns 403 on this instance. v2 uses env vars +
        # the local .frogbot-config.yml instead.
        uses: jfrog/frogbot@v2.35.2
        env:
          JF_URL: https://${{ env.REGISTRY }}
          JF_PROJECT: ssc-aurora
          JF_ACCESS_TOKEN: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: main
          JF_INCLUDE_ALL_VULNERABILITIES: "true"
          JF_ENABLE_SAST: "false"
          JF_ENABLE_SECRETS: "false"
          JF_ENABLE_IAC: "false"
          JF_FAIL: "false"
