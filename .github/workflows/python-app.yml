name: Simple Python Build and Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/python-app/**"
      - ".github/workflows/python-app.yml"
      - ".github/workflows/reusable-app-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/python-app/**"
      - ".github/workflows/python-app.yml"
      - ".github/workflows/reusable-app-build.yml"

jobs:
  build:
    uses: ./.github/workflows/reusable-app-build.yml
    permissions:
      id-token: write
      contents: read
      security-events: write
      pull-requests: write
    with:
      app: python-app
      language: Python
    secrets: inherit
