name: Test OIDC Permissions

on:
  push:
    branches: [feat/jfrog-oidc]
  workflow_dispatch:

env:
  REGISTRY: artifacts-artefacts.devops.cloud-nuage.canada.ca
  JFROG_CLI_LOG_LEVEL: DEBUG

jobs:
  test-oidc:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JFrog CLI with OIDC
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-jfrog-cli
        env:
          JF_URL: https://${{ env.REGISTRY }}
          JF_PROJECT: ssc-aurora
          JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"
          JFROG_CLI_LOG_LEVEL: DEBUG
        with:
          oidc-provider-name: github-oidc
          version: 2.91.0

      - name: Collect System Information
        run: |
          echo "=== SYSTEM INFO FOR JFROG SUPPORT CASE ==="
          echo "Workflow Run ID: ${{ github.run_id }}"
          echo "Date: $(date -u)"
          echo "JFrog CLI Version: $(jf --version)"
          echo "Authentication: OIDC"
          echo "Project: ssc-aurora"
          echo "========================================"

      - name: Test Basic JFrog Connection
        run: |
          echo "Testing basic JFrog connection..."
          jf rt ping

      - name: Test Xray Entitlements
        run: |
          echo "Testing Xray contextual analysis entitlements..."
          # Uses the authenticated CLI and includes the project scope (fixes the 403)
          jf xr curl -XGET \
            "/api/v1/entitlements/feature/contextual_analysis?projectKey=ssc-aurora"

      # Equivalent raw curl version, kept for reference. To use it:
      #   1. Uncomment the block below.
      #   2. The key fix vs. the original is appending ?projectKey=ssc-aurora
      #      (without the project scope this endpoint returns 403; with it, 200).
      # - name: Test Xray Entitlements (raw curl - reference only)
      #   run: |
      #     echo "Testing Xray contextual analysis entitlements via curl..."
      #     RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
      #       -H "Authorization: Bearer ${{ steps.setup-jfrog-cli.outputs.oidc-token }}" \
      #       "https://${{ env.REGISTRY }}/xray/api/v1/entitlements/feature/contextual_analysis?projectKey=ssc-aurora")
      #     echo "Response: $RESPONSE"

      - name: Test Docker Scan
        run: |
          echo "Testing docker scan on a public image..."
          docker pull hello-world
          jf docker scan hello-world --project=ssc-aurora --fail=false

      - name: Test Simple Audit Scan
        run: |
          echo "Testing simple audit scan..."
          cd examples/python-app
          jf audit --format=table --project=ssc-aurora --fail=false
