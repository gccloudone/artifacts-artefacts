name: Frogbot Pull Request Review

on:
  workflow_dispatch:
  pull_request: {}

env:
  REGISTRY: artifacts-artefacts.devops.cloud-nuage.canada.ca

jobs:
  frogbot:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JFrog CLI with OIDC
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-jfrog-cli
        env:
          JF_URL: https://${{ env.REGISTRY }}
          JF_PROJECT: ssc-aurora
          JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"
        with:
          oidc-provider-name: github-oidc
          version: 2.91.0

      - name: Run Frogbot
        uses: jfrog/frogbot@v2
        env:
          JF_URL: https://${{ env.REGISTRY }}
          JF_PROJECT: ssc-aurora
          JF_ACCESS_TOKEN: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_USE_GITHUB_ENVIRONMENT: "true"
          JF_INCLUDE_ALL_VULNERABILITIES: "true"
          JF_ENABLE_SAST: "true"
          JF_ENABLE_SECRETS: "true"
          JF_ENABLE_IAC: "false"
          JF_FAIL: "true"


